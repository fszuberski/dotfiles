- name: Deploy the shared Arch configuration
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Deploy configuration packages
      ansible.builtin.command:
        argv:
          - sh
          - "{{ playbook_dir }}/deployment/deploy.sh"
          - "{{ playbook_dir }}/stow/{{ item }}"
          - "{{ ansible_facts['env']['HOME'] }}"
      loop: "{{ dotfiles_stow_packages }}"
      register: stow_result
      changed_when: >-
        'LINK:' in stow_result.stderr or
        'UNLINK:' in stow_result.stderr or
        'MKDIR:' in stow_result.stderr or
        'RMDIR:' in stow_result.stderr
      tags: config
