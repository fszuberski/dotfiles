---
- name: Preflight the shared Arch environment
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Require Arch Linux and a regular user
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
          - ansible_facts['user_id'] != 'root'
        fail_msg: Run this playbook as the regular user on Arch Linux without global become.
      tags: always

    - name: Select shared configuration packages
      ansible.builtin.set_fact:
        dotfiles_stow_packages:
          - zsh
          - tmux
          - git
          - nvim
          - ghostty
          - opencode
          - sway
          - waybar
          - rofi
          - swaync
          - networkmanager-dmenu
      tags: always

    - name: Select Fleder display configuration
      ansible.builtin.set_fact:
        dotfiles_stow_packages: "{{ dotfiles_stow_packages + ['kanshi-fleder'] }}"
      when: ansible_facts['hostname'] == 'fleder'
      tags: always

    - name: Check all configuration packages for conflicts
      ansible.builtin.command:
        argv:
          - sh
          - "{{ playbook_dir }}/deployment/deploy.sh"
          - --check
          - "{{ playbook_dir }}/stow/{{ item }}"
          - "{{ ansible_facts['env']['HOME'] }}"
      loop: "{{ dotfiles_stow_packages }}"
      changed_when: false
      check_mode: false
      tags: config

- import_playbook: playbooks/packages.yml
  tags: install

