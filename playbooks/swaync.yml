---
- name: Install SwayNotificationCenter on Arch Linux
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This playbook supports Arch Linux only.

    - name: Install notification daemon and notification utility
      community.general.pacman:
        name:
          - swaync
          - libnotify
        state: present
      become: true
