---
- name: Install the graphical login components on Arch Linux
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This playbook supports Arch Linux only.

    - name: Install greetd and ReGreet
      community.general.pacman:
        name:
          - greetd
          - greetd-regreet
        state: present
      become: true
