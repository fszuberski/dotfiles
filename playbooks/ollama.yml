---
- name: Set up Ollama on Kikimora
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Install Ollama and AMD Vulkan support
      community.general.pacman:
        name: [ollama, ollama-vulkan, vulkan-radeon]
        state: present
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - ansible_facts['hostname'] == 'kikimora'
      tags: install

    - name: Create the Ollama systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - ansible_facts['hostname'] == 'kikimora'
      tags: system

    - name: Configure Ollama's context length
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service.d/10-dotfiles-context.conf
        content: |
          [Service]
          Environment="OLLAMA_CONTEXT_LENGTH=32768"
        owner: root
        group: root
        mode: '0644'
      become: true
      notify: Restart Ollama
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - ansible_facts['hostname'] == 'kikimora'
      tags: system

    - name: Enable and start Ollama
      ansible.builtin.systemd_service:
        name: ollama.service
        daemon_reload: true
        enabled: true
        state: started
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - ansible_facts['hostname'] == 'kikimora'
      tags: system

  handlers:
    - name: Restart Ollama
      ansible.builtin.systemd_service:
        name: ollama.service
        state: restarted
      become: true
