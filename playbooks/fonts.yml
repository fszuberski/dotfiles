---
- name: Install the terminal font on Arch Linux
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This font playbook currently supports Arch Linux only.

    - name: Install Meslo Nerd Font
      community.general.pacman:
        name: ttf-meslo-nerd
        state: present
      become: true
