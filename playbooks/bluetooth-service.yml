---
- name: Enable the Bluetooth system service on Arch Linux
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This playbook supports Arch Linux only.

    - name: Enable and start Bluetooth
      ansible.builtin.systemd_service:
        name: bluetooth.service
        enabled: true
        state: started
      become: true

    - name: Disable USB autosuspend for ASUS USB-BT500 adapters
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-asus-bt500-power.rules
        content: |
          ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="0b05", ATTR{idProduct}=="190e", TEST=="power/control", ATTR{power/control}="on"
        owner: root
        group: root
        mode: '0644'
      become: true
      notify: Reload udev rules

  handlers:
    - name: Reload udev rules
      ansible.builtin.command:
        argv: [udevadm, control, --reload-rules]
      changed_when: true
      become: true
