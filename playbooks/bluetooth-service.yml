---
- name: Enable the Bluetooth system service on Arch Linux
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This playbook supports Arch Linux only.

    - name: Enable and start Bluetooth
      ansible.builtin.systemd_service:
        name: bluetooth.service
        enabled: true
        state: started
      become: true
