---
- name: Install brightness controls on Arch Linux
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This playbook supports Arch Linux only.

    - name: Install brightnessctl
      community.general.pacman:
        name: brightnessctl
        state: present
      become: true
