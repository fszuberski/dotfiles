---
- name: Install Zsh on the local machine
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Require Arch Linux or macOS
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux' or ansible_facts['system'] == 'Darwin'
        fail_msg: This playbook supports Arch Linux and macOS only.

    - name: Install Zsh on Arch Linux
      community.general.pacman:
        name: zsh
        state: present
      become: true
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Install Zsh on macOS
      community.general.homebrew:
        name: zsh
        state: present
      when: ansible_facts['system'] == 'Darwin'

    - name: Install Oh My Zsh without running its installer
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
        depth: 1
        update: false

    - name: Install Powerlevel10k
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1
        update: false

    - name: Install zsh-autosuggestions
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        depth: 1
        update: false
