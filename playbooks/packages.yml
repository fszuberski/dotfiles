---
- name: Install general-purpose packages
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Require Arch Linux or macOS
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux' or ansible_facts['system'] == 'Darwin'
        fail_msg: This playbook supports Arch Linux and macOS only.

    - name: Install general packages on Arch Linux
      community.general.pacman:
        name:
          - adobe-source-code-pro-fonts
          - base-devel
          - bc
          - bluez-utils
          - btop
          - calibre
          - cmus
          - docker
          - docker-compose
          - fastfetch
          - firefox-developer-edition
          - fzf
          - git
          - git-delta
          - go
          - gradle
          - httpie
          - jdk11-openjdk
          - jdk17-openjdk
          - jdk21-openjdk
          - jdk25-openjdk
          - kotlin
          - maven
          - nodejs
          - noto-fonts
          - npm
          - ntfs-3g
          - nvm
          - otf-font-awesome
          - pass
          - python-pexpect
          - qbittorrent
          - ripgrep-all
          - rofi
          - signal-desktop
          - ttf-roboto
          - ttf-roboto-mono
          - unzip
          - usbutils
          - wget
          - zathura
          - zathura-cb
          - zathura-djvu
          - zathura-pdf-mupdf
          - zathura-ps
        state: present
      become: true
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Check the default Java environment on Arch Linux
      ansible.builtin.command:
        argv: [archlinux-java, get]
      register: default_java_environment
      changed_when: false
      failed_when: default_java_environment.rc not in [0, 1]
      check_mode: false
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Select OpenJDK 25 as the default on Arch Linux
      ansible.builtin.command:
        argv: [archlinux-java, set, java-25-openjdk]
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - default_java_environment.stdout | trim != 'java-25-openjdk'

    - name: Install general packages on macOS
      community.general.homebrew:
        name:
          - git-delta
          - node
          - go
          - unzip
        state: present
      when: ansible_facts['system'] == 'Darwin'
