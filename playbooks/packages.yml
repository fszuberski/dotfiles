---
- name: Install general-purpose packages
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Require Arch Linux or macOS
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux' or ansible_facts['system'] == 'Darwin'
        fail_msg: This playbook supports Arch Linux and macOS only.

    - name: Require a regular user for Docker group membership on Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['user_id'] != 'root'
        fail_msg: Run this playbook as the regular user without global become.
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Check enabled Arch repositories
      ansible.builtin.command:
        argv: [pacman-conf, --repo-list]
      register: arch_repositories
      changed_when: false
      check_mode: false
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Enable the Arch multilib repository
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: '# {mark} ANSIBLE MANAGED MULTILIB REPOSITORY'
        block: |
          [multilib]
          Include = /etc/pacman.d/mirrorlist
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - "'multilib' not in arch_repositories.stdout_lines"

    - name: Refresh Arch package databases before installing packages
      community.general.pacman:
        update_cache: true
      become: true
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Check installed Arch kernels
      ansible.builtin.command:
        argv: [pacman, -Qq, "{{ item }}"]
      loop: [linux, linux-lts]
      register: installed_arch_kernels
      changed_when: false
      failed_when: installed_arch_kernels.rc not in [0, 1]
      check_mode: false
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Install headers for installed Arch kernels
      community.general.pacman:
        name: "{{ item.item }}-headers"
        state: present
      loop: "{{ installed_arch_kernels.results }}"
      loop_control:
        label: "{{ item.item }}"
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - item.rc == 0

    - name: Install general packages on Arch Linux
      community.general.pacman:
        name:
          - adobe-source-code-pro-fonts
          - base-devel
          - bc
          - bluez-utils
          - btop
          - calibre
          - cmus
          - docker
          - docker-compose
          - fastfetch
          - firefox-developer-edition
          - fzf
          - git
          - git-delta
          - go
          - gradle
          - httpie
          - jdk11-openjdk
          - jdk17-openjdk
          - jdk21-openjdk
          - jdk25-openjdk
          - kotlin
          - maven
          - nodejs
          - noto-fonts
          - noto-fonts-emoji
          - npm
          - ntfs-3g
          - nvm
          - obs-studio
          - openssh
          - otf-font-awesome
          - pass
          - python-pexpect
          - qbittorrent
          - ripgrep-all
          - rofi
          - signal-desktop
          - ttf-roboto
          - ttf-roboto-mono
          - unzip
          - usbutils
          - v4l2loopback-dkms
          - vlc
          - vlc-plugin-ffmpeg
          - wget
          - zathura
          - zathura-cb
          - zathura-djvu
          - zathura-pdf-mupdf
          - zathura-ps
        state: present
      become: true
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Add the regular user to the Docker group on Arch Linux
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: docker
        append: true
      become: true
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Enable and start Docker on Arch Linux
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
        state: started
      become: true
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Install Steam on Kikimora
      community.general.pacman:
        name: steam
        state: present
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - ansible_facts['hostname'] == 'kikimora'

    - name: Check the default Java environment on Arch Linux
      ansible.builtin.command:
        argv: [archlinux-java, get]
      register: default_java_environment
      changed_when: false
      failed_when: default_java_environment.rc not in [0, 1]
      check_mode: false
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Select OpenJDK 25 as the default on Arch Linux
      ansible.builtin.command:
        argv: [archlinux-java, set, java-25-openjdk]
      become: true
      when:
        - ansible_facts['distribution'] == 'Archlinux'
        - default_java_environment.stdout | trim != 'java-25-openjdk'

    - name: Install general packages on macOS
      community.general.homebrew:
        name:
          - git-delta
          - node
          - go
          - unzip
        state: present
      when: ansible_facts['system'] == 'Darwin'
