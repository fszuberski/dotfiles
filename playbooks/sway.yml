---
- name: Install Sway on Arch Linux
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This playbook supports Arch Linux only.

    - name: Install Sway and core Wayland dependencies
      community.general.pacman:
        name:
          - sway
          - swaybg
          - wmenu
          - xorg-xwayland
          - polkit
        state: present
      become: true
