---
- name: Deploy the separate graphical login test configuration
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    greeter_test_files:
      - source: "{{ playbook_dir }}/../configuration/greetd/test-config.toml"
        dest: /etc/greetd/dotfiles-test-config.toml
      - source: "{{ playbook_dir }}/../configuration/greetd/sway-config"
        dest: /etc/greetd/dotfiles-sway-config
  tasks:
    - name: Require Arch Linux and a regular user
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
          - ansible_facts['user_id'] != 'root'
        fail_msg: Run this playbook as a regular user on Arch Linux without global become.

    - name: Inspect source files
      ansible.builtin.stat:
        path: "{{ item.source }}"
        checksum_algorithm: sha256
      loop: "{{ greeter_test_files }}"
      register: greeter_test_sources

    - name: Inspect destination files without following symlinks
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ greeter_test_files }}"
      register: greeter_test_destinations

    - name: Refuse to replace a different or non-regular file
      ansible.builtin.assert:
        that:
          - item.0.stat.isreg | default(false)
          - not (item.1.stat.islnk | default(false))
          - not item.1.stat.exists or (item.1.stat.isreg | default(false) and item.1.stat.checksum | default('') == item.0.stat.checksum | default(''))
        fail_msg: "{{ item.1.item.dest }} already exists and differs; inspect it manually."
      loop: "{{ greeter_test_sources.results | zip(greeter_test_destinations.results) | list }}"
      loop_control:
        label: "{{ item.1.item.dest }}"

    - name: Install the separate test configuration
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
        force: false
      loop: "{{ greeter_test_files }}"
      become: true
